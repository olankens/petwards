services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petwards
      POSTGRES_USER: dummy
      POSTGRES_PASSWORD: dummy
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dummy -d petwards" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
